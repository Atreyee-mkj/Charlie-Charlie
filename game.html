<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Charlie Charlie Challenge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="gamepage">

  <div class="overlay"></div>

  <h1 class="title">Charlie Charlie Challenge</h1>

  <div class="game-container">

    <!-- Pencil Area -->
    <div class="pencil-area">
      <div class="pencil" id="pencil"></div>
      <div class="pencil" id="pencil2"></div>
    </div>
    <div class="pencil-area">
  <div class="label top">YES</div>
  <div class="label bottom">YES</div>
  <div class="label left">NO</div>
  <div class="label right">NO</div>

  <div class="pencil" id="pencil"></div>
  <div class="pencil" id="pencil2"></div>
</div>

    <!-- Response -->
    <div id="response" class="response">
      Waiting for Charlie...
    </div>

    <!-- Input -->
    <input 
      type="text" 
      id="question" 
      placeholder="Ask Charlie your question..."
      autocomplete="off"
    >

    <!-- Button -->
    <button id="askBtn">Ask Charlie</button>

  </div>

  <!-- Candles -->
  <div class="candles">
    <div class="candle"></div>
    <div class="candle"></div>
  </div>

  <!-- Audio -->
  <audio id="bg-music" src="BGmusic3.mp3" loop></audio>
  <audio id="whisper1" src="BGmusic1.mp3"></audio>
  <audio id="whisper2" src="BGmusic2.mp3"></audio>

  <!-- IMPORTANT: script at the end (you already did this right 👍) -->
  <script src="script.js"></script>

</body>
</html>
